<style>

body{

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:white;

.logo{

.navlinks{

}

.btn{
    text-decoration:none;
    padding:18px 25px;

    padding:20px;

    margin-top:auto;

.footerlinks{
    display:flex;

    gap:30px;
