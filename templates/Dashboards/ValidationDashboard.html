<!DOCTYPE html>
<head>
    <title>EduTraceValidation</title>
</head>

<body>
    <form action="/ValidateDocument"
      method="POST"
      enctype="multipart/form-data">

    <p>Select Document</p>

    <input type="file" name="document">

    <button type="submit">
        Validate
    </button>

</form>
    <p>{{error}}</p>
    <p>{{success}}</p>
    <a href="/">Return to homepage</a><br>
</body>
